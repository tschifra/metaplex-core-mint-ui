name: Feature request
description: Suggest a collection-neutral improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Proposed changes should remain collection-neutral and preserve the on-chain Candy Guard as the security boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What cannot be achieved with the current UI?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and configuration surface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or simpler alternatives you evaluated.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is collection-neutral and does not embed customer secrets or branding.
          required: true
